name: lan_ai_cli_control
version: 1.4.10+12
publish_to: "none"
description: Private LAN AI CLI control app shell.

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: 0.7.4
  archive: ^4.0.7
  crypto: ^3.0.6
  http: ^1.2.2
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  record: ^6.2.0
  sherpa_onnx: 1.12.36
  shared_preferences: ^2.3.3
  file_picker: ^11.0.2

dependency_overrides:
  sherpa_onnx_windows: 1.12.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lobe-icons/

