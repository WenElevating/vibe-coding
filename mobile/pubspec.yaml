name: lan_ai_cli_control
version: 1.3.0+1
publish_to: "none"
description: Private LAN AI CLI control app shell.

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown:
    path: ../.omx/manual_packages/flutter-markdown
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  markdown:
    path: ../.omx/manual_packages/markdown
  args:
    path: ../.omx/manual_packages/args

flutter:
  uses-material-design: true

